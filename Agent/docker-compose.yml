services:
  app:
    build: .
    container_name: agent_app
    working_dir: /app
    # start_server derives one worker for development/SQLite and four for
    # production/PostgreSQL.  An explicit WEB_CONCURRENCY>1 with a local
    # ledger is rejected before Flask imports.
    command: python scripts/start_server.py
    init: true
    ports:
      - "${PUBLIC_PORT:-5003}:5003"
    volumes:
      - .:/app
      - app_data:/app/data
      - app_uploads:/app/uploads
    env_file:
      - .env
    restart: always

  kb-init:
    build: .
    container_name: agent_kb_init
    working_dir: /app
    command: python builder.py --input ./知识库 --output ./knowledge_base
    volumes:
      - .:/app
    env_file:
      - .env
    profiles:
      - init

volumes:
  app_data:
  app_uploads:
